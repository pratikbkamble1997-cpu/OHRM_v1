name: Playwright Cucumber PR CI

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd-smoke-suite:
    name: Run Cucumber BDD Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber BDD Tests
        run: |
          mkdir -p reports
          npx cucumber-js --tags "@smoke" --format html:reports/cucumber-report.html --format json:reports/cucumber-report.json
        env:
          CI: true

      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report-${{ github.run_number }}
          path: reports/
          retention-days: 7